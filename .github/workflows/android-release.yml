name: Build signed Android release

on:
  workflow_dispatch:
  # Build-only CI branch: produces an Actions artifact but never creates a GitHub Release.
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: signed-android-release
  cancel-in-progress: false

jobs:
  build:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Go 1.26
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            TMessagesProj/src/main/go/tgwsproxy/go.mod
            TMessagesProj/src/main/go/xrayengine/go.sum

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK components
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.31.6"

      - name: Build encrypted proxy native libraries
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: |
          chmod +x \
            TMessagesProj/src/main/go/tgwsproxy/build.sh \
            TMessagesProj/src/main/go/xrayengine/build.sh
          TMessagesProj/src/main/go/tgwsproxy/build.sh
          TMessagesProj/src/main/go/xrayengine/build.sh
          for abi in arm64-v8a x86_64; do
            test -s "TMessagesProj/jni/$abi/libtgwsproxy.so"
            test -s "TMessagesProj/jni/$abi/libxray.so"
            file "TMessagesProj/jni/$abi/libtgwsproxy.so" "TMessagesProj/jni/$abi/libxray.so"
          done

      - name: Restore signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > TMessagesProj/release-sovietgram-2026.jks
          test -s TMessagesProj/release-sovietgram-2026.jks

      - name: Compile-check Kotlin and Java
        shell: bash
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$LOCAL_PROPERTIES"
          test -n "$GOOGLE_SERVICES_JSON"
          chmod +x gradlew
          ./gradlew \
            :TMessagesProj:compileReleaseKotlin \
            :TMessagesProj:compileReleaseJavaWithJavac \
            --no-daemon --stacktrace

      - name: Build signed release APK
        shell: bash
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$LOCAL_PROPERTIES"
          test -n "$GOOGLE_SERVICES_JSON"
          chmod +x gradlew
          ./gradlew :TMessagesProj:assembleRelease --no-daemon --stacktrace

      - name: Verify APK output
        shell: bash
        run: |
          find TMessagesProj/build/outputs/apk/release -type f -name '*.apk' -print -quit \
            | grep -q .

      - name: Upload signed APKs
        uses: actions/upload-artifact@v7
        with:
          name: SovietGram-signed-${{ github.sha }}
          path: TMessagesProj/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove restored secret files
        if: always()
        shell: bash
        run: |
          rm -f \
            TMessagesProj/release-sovietgram-2026.jks \
            TMessagesProj/google-services.json
